<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#120C52">
<title>LoEntrego · Enlaces</title>
<meta name="description" content="LoEntrego: logística de última milla en Bogotá, Funza y Soacha. Envía con nosotros, únete al equipo o sigue tu pedido.">
<meta property="og:title" content="LoEntrego · Logística de última milla">
<meta property="og:description" content="Envíos para comercios en Bogotá, Funza y Soacha.">
<meta property="og:image" content="img/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;600;700;800&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css?v=5">
<link rel="icon" href="img/icon-192.png">
<link rel="apple-touch-icon" href="img/apple-touch-icon.png">
</head>
<body>

<main class="col">

  <!-- ===== Cabecera: la ciudad en vivo ===== -->
  <header class="cab">
    <div class="ciudad" aria-hidden="true">
      <svg viewBox="0 0 400 220" preserveAspectRatio="xMidYMid slice">
        <g class="calles">
          <path d="M-10 40 L410 18 M-10 92 L410 70 M-10 146 L410 124 M-10 198 L410 176 M40 -10 L66 230 M120 -10 L146 230 M200 -10 L226 230 M280 -10 L306 230 M360 -10 L386 230"/>
        </g>
        <g class="avenidas">
          <path d="M-10 168 C 90 150, 140 60, 230 64 S 350 120, 410 40"/>
          <path d="M60 230 C 90 160, 110 100, 180 -10"/>
        </g>
        <path id="ruta-a" class="cometa-ruta" pathLength="100" d="M-10 168 C 90 150, 140 60, 230 64 S 350 120, 410 40"/>
        <path id="ruta-b" class="cometa-ruta lento" pathLength="100" d="M60 230 C 90 160, 110 100, 180 -10"/>
        <g class="nodos">
          <circle cx="120" cy="114" r="4"/><circle cx="230" cy="64" r="4"/><circle cx="330" cy="98" r="4"/><circle cx="78" cy="152" r="4"/>
        </g>
        <g class="ping" transform="translate(230 64)"><circle r="6"/></g>
        <g class="ping p2" transform="translate(78 152)"><circle r="6"/></g>
      </svg>
    </div>
    <button type="button" class="compartir" id="compartir" aria-label="Compartir esta página">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><path d="m8.6 13.5 6.8 4M15.4 6.5l-6.8 4"/></svg>
    </button>
    <div class="cab-in">
      <div class="avatar"><img src="img/isotipo-blanco.png" alt="" width="553" height="544"></div>
      <h1><img class="wordmark" src="img/loentrego-logo-blanco.png" alt="LoEntrego — Logística de última milla" width="1383" height="374"></h1>
      <p class="frase" id="frase">Llevamos los pedidos de tu comercio hasta la puerta de tu cliente.</p>
      <div class="vivo"><span class="dot" aria-hidden="true"></span><span>En ruta ahora en <b>Bogotá · Funza · Soacha</b></span></div>
    </div>
  </header>

  <!-- ===== ¿Quién eres? ===== -->
  <section class="quien" aria-labelledby="t-quien">
    <h2 id="t-quien">¿Quién eres?</h2>
    <div class="perfiles" role="tablist" aria-label="Elige tu perfil">
      <button type="button" role="tab" data-perfil="comercio"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 9.5 12 4l9 5.5V20H3Z"/><path d="M9 20v-6h6v6"/></svg>Comercio</button>
      <button type="button" role="tab" data-perfil="repartidor"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="5.5" cy="16.5" r="3.5"/><circle cx="18.5" cy="16.5" r="3.5"/><path d="M5.5 16.5h5l3.5-6h3l1.5 6M14 10.5l-1.5-3H10"/></svg>Repartidor</button>
      <button type="button" role="tab" data-perfil="cliente"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M21 8 12 3 3 8v8l9 5 9-5Z"/><path d="m3 8 9 5 9-5M12 13v8"/></svg>Cliente</button>
      <span class="perfil-luz" aria-hidden="true"></span>
    </div>
  </section>

  <!-- ===== La ruta: cada enlace es una parada ===== -->
  <section class="ruta" id="ruta" aria-live="polite">
    <div class="ruta-linea" aria-hidden="true"><i class="ruta-hecha"></i><i class="cometa"></i></div>
    <ol class="paradas" id="paradas"></ol>
    <div class="entregado">
      <span class="nodo nodo-fin" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M5 12.5 10 17.5 19 7"/></svg></span>
      <div class="entregado-txt">
        <b>Entregado</b>
        <small>Síguenos para ver la ruta de cada día</small>
        <nav class="redes" id="redes" aria-label="Redes sociales"></nav>
      </div>
    </div>
  </section>

  <footer class="pie">
    <span class="iso" aria-hidden="true"></span>
    <span>© 2026 LoEntrego · Logística de última milla</span>
  </footer>
</main>

<div class="toast" id="toast" role="status" aria-live="polite"></div>
<script src="script.js?v=7"></script>
</body>
</html>
