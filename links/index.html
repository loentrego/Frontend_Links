<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#120C52">
<title>LoEntrego · Enlaces</title>
<meta name="description" content="LoEntrego: logística de última milla en Bogotá, Funza y Soacha. Envía con nosotros, únete al equipo o sigue tu pedido.">
<meta property="og:title" content="LoEntrego · Logística de última milla">
<meta property="og:description" content="Envíos para comercios en Bogotá, Funza y Soacha.">
<meta property="og:image" content="img/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;600;700;800&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css?v=21">
<link rel="icon" href="img/icon-192.png">
<link rel="apple-touch-icon" href="img/apple-touch-icon.png">
</head>
<body>

<main class="col">

  <!-- ===== Cabecera: el perfil ===== -->
  <header class="cab">
    <button type="button" class="compartir" id="compartir" aria-label="Compartir esta página">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><path d="m8.6 13.5 6.8 4M15.4 6.5l-6.8 4"/></svg>
    </button>
    <div class="avatar-wrap">
      <div class="avatar"><img src="img/isotipo-blanco.png" alt="" width="553" height="544"></div>
    </div>
    <h1>@loentrego <span class="verif" title="Cuenta oficial" aria-label="Cuenta oficial"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m12 2 2.4 1.8 3-.2 1 2.8 2.6 1.6-.7 2.9 1.2 2.7-2.3 1.9-.4 3-3 .5L12 22l-2.4-1.8-3 .2-1-2.8-2.6-1.6.7-2.9L2.5 10.4 4.8 8.5l.4-3 3-.5Z"/><path class="ok" d="m8.5 12.2 2.4 2.3 4.6-4.8"/></svg></span></h1>
    <p class="bio" id="frase">Une tu comercio a LoEntrego: recogemos tus pedidos y los llevamos hasta tu cliente.</p>
    <p class="vivo"><i aria-hidden="true"></i>En ruta ahora · Bogotá · Funza · Soacha</p>
  </header>

  <!-- ===== La ruta: cada enlace es una parada ===== -->
  <section class="ruta" id="ruta" aria-live="polite">
    <div class="ruta-linea" aria-hidden="true"><i class="ruta-hecha"></i><i class="cometa"></i></div>
    <ol class="paradas" id="paradas"></ol>
    <div class="entregado">
      <span class="nodo nodo-fin" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M5 12.5 10 17.5 19 7"/></svg></span>
      <div class="entregado-txt">
        <b>Entregado</b>
        <small>Síguenos para ver la ruta de cada día</small>
        <nav class="redes" id="redes" aria-label="Redes sociales"></nav>
      </div>
    </div>
  </section>

  <footer class="pie">
    <span class="iso" aria-hidden="true"></span>
    <span>© 2026 LoEntrego · Logística de última milla</span>
  </footer>
</main>

<div class="toast" id="toast" role="status" aria-live="polite"></div>
<script src="script.js?v=20"></script>
</body>
</html>
