<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#1B1370">
<title>LoEntrego · Enlaces</title>
<meta name="description" content="LoEntrego: logística de última milla en Bogotá, Funza y Soacha. Escríbenos, envía con nosotros o únete al equipo.">
<meta property="og:title" content="LoEntrego · Logística de última milla">
<meta property="og:description" content="Envíos para comercios en Bogotá, Funza y Soacha.">
<meta property="og:image" content="img/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css?v=12">
<link rel="icon" href="img/icon-192.png">
<link rel="apple-touch-icon" href="img/apple-touch-icon.png">
</head>
<body>

<!-- Fondo: estrellas arriba y el planeta con Bogotá asomando abajo -->
<div class="fondo" aria-hidden="true">
  <div class="estrellas"></div>
  <img class="planeta" src="img/planeta.png" alt="" width="1600" height="1000">
</div>

<main class="col">
  <button type="button" class="compartir" id="compartir" aria-label="Compartir esta página">
    <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><path d="m8.6 13.5 6.8 4M15.4 6.5l-6.8 4"/></svg>
  </button>

  <header class="perfil">
    <div class="avatar-wrap">
      <svg class="orbita" viewBox="0 0 160 160" aria-hidden="true"><ellipse cx="80" cy="80" rx="76" ry="30"/><circle class="sat" cx="156" cy="80" r="4"/></svg>
      <div class="avatar"><img src="img/isotipo-blanco.png" alt="" width="553" height="544"></div>
    </div>
    <h1>@loentrego <span class="verif" title="Cuenta oficial" aria-label="Cuenta oficial"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m12 2 2.4 1.8 3-.2 1 2.8 2.6 1.6-.7 2.9 1.2 2.7-2.3 1.9-.4 3-3 .5L12 22l-2.4-1.8-3 .2-1-2.8-2.6-1.6.7-2.9L2.5 10.4 4.8 8.5l.4-3 3-.5Z"/><path class="ok" d="m8.5 12.2 2.4 2.3 4.6-4.8"/></svg></span></h1>
    <p class="bio">Logística de última milla. Tus pedidos, <b>en movimiento</b> 📦</p>
    <p class="vivo"><i aria-hidden="true"></i>En ruta ahora · Bogotá · Funza · Soacha</p>
  </header>

  <!-- Botones (se arman en script.js desde la lista ENLACES) -->
  <nav class="enlaces" id="enlaces" aria-label="Enlaces de LoEntrego"></nav>

  <nav class="redes" id="redes" aria-label="Redes y contacto"></nav>

  <footer class="pie"><img src="img/loentrego-logo-blanco.png" alt="LoEntrego" width="1383" height="374"></footer>
</main>

<div class="toast" id="toast" role="status" aria-live="polite"></div>
<script src="script.js?v=11"></script>
</body>
</html>
